name: Verify live rotation

on:
  pull_request:
    paths:
      - "index.html"
      - "room-data.js"
      - "live-sync.js"
      - "app.js"
      - "rotation-engine.js"
      - "sw.js"
      - "firestore.rules"
      - "version.json"
      - "scripts/prepare-hosting.js"
      - "firestore.indexes.json"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - "DESIGN.md"
      - "UX-CONTRACT.md"
      - "premium-ui.json"
      - ".github/workflows/verify-live-rotation.yml"
  push:
    branches:
      - "agent/live-shared-rotation"
      - "agent/skill-courts-notifications-help"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
