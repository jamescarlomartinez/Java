<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pickleball Game Rotation by James Martinez</title>
  <style>
    :root {
      --bg: #0d1f17;
      --card: #152b1e;
      --card2: #1a3528;
      --border: #2a5a3e;
      --primary: #3a9e6e;
      --primary-light: #6dcfa0;
      --primary-dark: #1b4332;
      --accent: #f4a261;
      --accent2: #e76f51;
      --text: #d8f3dc;
      --text-dim: #8ecfaa;
      --text-muted: #4d8a6a;
      --danger: #e63946;
      --warn: #f4a261;
      --info: #52b788;
      --wait-bg: #1a1a2e;
      --wait-border: #3a3a60;
      --wait-text: #a0a0cc;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 48px;
    }

    /* ── HEADER ── */
    .app-header {
      background: linear-gradient(160deg, #1b4332 0%, #2d6a4f 60%, #1b4332 100%);
      border-bottom: 3px solid var(--accent);
      padding: 18px 16px 14px;
      text-align: center;
      position: sticky; top: 0; z-index: 200;
      box-shadow: 0 3px 16px rgba(0,0,0,.5);
    }
    .header-logo { font-size: 2rem; line-height: 1; margin-bottom: 4px; }
    .header-title {
      font-size: 1.25rem; font-weight: 900; letter-spacing: 1.5px;
      text-transform: uppercase; color: #fff;
    }
    .header-subtitle { font-size: 0.72rem; color: var(--primary-light); letter-spacing: 0.5px; margin-top: 2px; }

    /* ── CONTAINER ── */
    .container { max-width: 620px; margin: 0 auto; padding: 12px 12px 0; }

    /* ── CARD ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 0.8rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--primary-light); margin-bottom: 12px;
      display: flex; align-items: center; gap: 6px;
    }

    /* ── INPUT ROW ── */
    .input-row { display: flex; gap: 8px; }
    .text-input {
      flex: 1; background: var(--bg); border: 2px solid var(--border);
      border-radius: 10px; padding: 13px 14px;
      color: var(--text); font-size: 1rem; outline: none;
      -webkit-appearance: none; transition: border-color .15s;
    }
    .text-input:focus { border-color: var(--primary-light); }
    .text-input::placeholder { color: var(--text-muted); }

    /* ── BUTTONS ── */
    .btn {
      padding: 13px 18px; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 800; cursor: pointer;
      transition: transform .1s, filter .15s; letter-spacing: .3px;
      white-space: nowrap; display: inline-flex; align-items: center;
      justify-content: center; gap: 6px;
    }
    .btn:active { transform: scale(.96); filter: brightness(.9); }
    .btn-primary  { background: var(--primary); color: #fff; }
    .btn-accent   { background: var(--accent); color: #1a1a1a; }
    .btn-danger   { background: var(--danger); color: #fff; }
    .btn-ghost    { background: var(--card2); color: var(--text-dim); border: 1px solid var(--border); }
    .btn-reset    { background: #263a30; color: var(--text-dim); border: 1px solid var(--border); }
    .btn-sm       { padding: 7px 13px; font-size: 0.8rem; border-radius: 8px; }
    .btn-block    { width: 100%; padding: 15px; font-size: 1rem; border-radius: 12px; }
    .btn:disabled { opacity: .4; pointer-events: none; }

    /* ── PLAYER LIST ── */
    .player-list {
      margin-top: 10px; max-height: 230px;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .player-list::-webkit-scrollbar { width: 3px; }
    .player-list::-webkit-scrollbar-track { background: transparent; }
    .player-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .player-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 9px; margin-bottom: 6px;
      gap: 8px;
    }
    .player-name { font-size: 0.95rem; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .games-badge {
      font-size: 0.68rem; background: var(--primary); color: #fff;
      padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }
    .empty-hint { text-align: center; color: var(--text-muted); font-size: 0.88rem; padding: 20px 0; }

    /* ── COURT SELECTOR ── */
    .court-selector { display: flex; gap: 7px; flex-wrap: wrap; }
    .court-btn {
      flex: 1; min-width: 44px; padding: 13px 6px;
      background: var(--bg); border: 2px solid var(--border);
      border-radius: 10px; color: var(--text-dim);
      font-size: 1rem; font-weight: 800; cursor: pointer;
      text-align: center; transition: all .15s;
    }
    .court-btn:active { transform: scale(.95); }
    .court-btn.active { background: var(--primary); border-color: var(--primary-light); color: #fff; }

    /* ── STATS BAR ── */
    .stats-row { display: flex; gap: 8px; margin-top: 14px; }
    .stat-cell {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 8px; text-align: center;
    }
    .stat-num { font-size: 1.55rem; font-weight: 900; color: var(--primary-light); line-height: 1; }
    .stat-lbl { font-size: 0.65rem; color: var(--text-muted); margin-top: 3px; text-transform: uppercase; letter-spacing: .5px; }

    /* ── MESSAGE BOX ── */
    .msg-box {
      border-radius: 10px; padding: 12px 15px; font-size: 0.9rem; font-weight: 600;
      margin-bottom: 12px; display: none; border: 1px solid;
    }
    .msg-box.warning { display: block; background: rgba(244,162,97,.15); border-color: var(--warn); color: var(--warn); }
    .msg-box.error   { display: block; background: rgba(230,57,70,.15); border-color: var(--danger); color: #ff9090; }
    .msg-box.success { display: block; background: rgba(82,183,136,.15); border-color: var(--info); color: var(--info); }
    .msg-box.info    { display: block; background: rgba(58,158,110,.1); border-color: var(--border); color: var(--text-dim); }

    /* ── ACTION BUTTONS ── */
    .action-row { display: flex; gap: 9px; margin-bottom: 12px; }

    /* ── ROUND DISPLAY ── */
    .no-round { text-align: center; padding: 32px 16px; color: var(--text-muted); }
    .no-round-icon { font-size: 3.5rem; margin-bottom: 10px; }
    .no-round p { font-size: 0.95rem; line-height: 1.6; }
    .no-round strong { color: var(--accent); }

    .round-header { text-align: center; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .round-lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
    .round-num { font-size: 2rem; font-weight: 900; color: var(--accent); line-height: 1.1; }

    /* ── COURT CARDS ── */
    .court-card {
      border-radius: 13px; padding: 14px; margin-bottom: 10px;
      border: 1px solid; animation: fadeUp .25s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .court-card-1 { background: #122b20; border-color: #2a6040; }
    .court-card-2 { background: #122040; border-color: #2a4a80; }
    .court-card-3 { background: #2a1a08; border-color: #7a4a10; }
    .court-card-4 { background: #1e0f30; border-color: #602888; }
    .court-card-5 { background: #0f2a30; border-color: #1a6878; }
    .court-card-6 { background: #2a0f18; border-color: #782030; }

    .court-name {
      font-size: 0.9rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1px; color: #fff; margin-bottom: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .court-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-1 { background: #3aaf6a; }
    .dot-2 { background: #4a8af0; }
    .dot-3 { background: #f0a040; }
    .dot-4 { background: #a040f0; }
    .dot-5 { background: #20b8d8; }
    .dot-6 { background: #f04060; }

    .teams-row { display: flex; align-items: stretch; gap: 8px; }
    .team-box {
      flex: 1; background: rgba(0,0,0,.28); border-radius: 9px; padding: 12px;
    }
    .team-lbl {
      font-size: 0.68rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1px; color: var(--primary-light); margin-bottom: 8px;
    }
    .team-player { font-size: 0.93rem; font-weight: 600; padding: 3px 0; color: #fff; }
    .team-player span { margin-right: 5px; }
    .vs-col {
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px; font-weight: 900; color: var(--accent);
      font-size: 0.85rem; flex-shrink: 0;
    }

    /* ── WAITING SECTION ── */
    .waiting-card {
      background: var(--wait-bg); border: 1px solid var(--wait-border);
      border-radius: 13px; padding: 14px; margin-bottom: 10px;
    }
    .waiting-header {
      font-size: 0.8rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1px; color: var(--wait-text); margin-bottom: 10px;
    }
    .waiting-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .waiting-chip {
      background: #252540; border: 1px solid var(--wait-border);
      border-radius: 20px; padding: 7px 14px;
      font-size: 0.88rem; font-weight: 600; color: var(--wait-text);
    }

    /* ── PLAYER STATS ── */
    .stats-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .stats-table th {
      text-align: left; padding: 7px 10px;
      color: var(--text-muted); font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: .5px;
      border-bottom: 1px solid var(--border);
    }
    .stats-table td { padding: 8px 10px; border-bottom: 1px solid rgba(42,90,62,.3); vertical-align: middle; }
    .stats-table tr:last-child td { border-bottom: none; }
    .play-bar-wrap { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; min-width: 40px; }
    .play-bar { height: 100%; background: var(--primary); border-radius: 3px; transition: width .4s ease; }

    /* ── DIVIDER ── */
    .divider { height: 1px; background: var(--border); margin: 12px 0; opacity: .4; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 22px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1b4332; color: #fff;
      padding: 12px 22px; border-radius: 24px;
      font-size: 0.88rem; font-weight: 700;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
      border: 1px solid var(--primary-light);
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      z-index: 1000; text-align: center; max-width: 88vw;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header class="app-header">
  <div class="header-logo">🏓</div>
  <div class="header-title">Pickleball Game Rotation</div>
  <div class="header-subtitle">by James Martinez</div>
</header>

<div class="container">

  <!-- Message -->
  <div class="msg-box" id="msgBox"></div>

  <!-- Player Management -->
  <div class="card">
    <div class="card-title">👥 Players</div>
    <div class="input-row">
      <input class="text-input" id="playerInput" type="text"
        placeholder="Enter player name…" maxlength="30"
        autocomplete="off" autocorrect="off" autocapitalize="words"
        spellcheck="false">
      <button class="btn btn-primary" id="addBtn" onclick="addPlayer()">Add</button>
    </div>
    <div class="player-list" id="playerList"></div>
    <div class="divider"></div>
    <button class="btn btn-ghost btn-sm" style="width:100%" onclick="clearAllPlayers()">
      🗑 Clear All Players
    </button>
  </div>

  <!-- Court Settings -->
  <div class="card">
    <div class="card-title">🏟️ Number of Courts</div>
    <div class="court-selector" id="courtSelector">
      <button class="court-btn" data-n="1" onclick="setCourts(1)">1</button>
      <button class="court-btn active" data-n="2" onclick="setCourts(2)">2</button>
      <button class="court-btn" data-n="3" onclick="setCourts(3)">3</button>
      <button class="court-btn" data-n="4" onclick="setCourts(4)">4</button>
      <button class="court-btn" data-n="5" onclick="setCourts(5)">5</button>
      <button class="court-btn" data-n="6" onclick="setCourts(6)">6</button>
    </div>
    <div class="stats-row">
      <div class="stat-cell"><div class="stat-num" id="sTotal">0</div><div class="stat-lbl">Players</div></div>
      <div class="stat-cell"><div class="stat-num" id="sPlaying">0</div><div class="stat-lbl">Playing</div></div>
      <div class="stat-cell"><div class="stat-num" id="sWaiting">0</div><div class="stat-lbl">Waiting</div></div>
      <div class="stat-cell"><div class="stat-num" id="sCourts">0</div><div class="stat-lbl">Active Courts</div></div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="action-row">
    <button class="btn btn-accent btn-block" style="flex:2" onclick="generateRound()">
      ▶ Generate Next Round
    </button>
    <button class="btn btn-reset btn-block" style="flex:1" onclick="resetRotation()">
      ↺ Reset
    </button>
  </div>

  <!-- Round Display -->
  <div id="roundDisplay"></div>

  <!-- Player Stats -->
  <div class="card" id="statsCard" style="display:none">
    <div class="card-title">📊 Play Count Stats</div>
    <table class="stats-table">
      <thead>
        <tr>
          <th>Player</th>
          <th style="text-align:center">Games</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="statsBody"></tbody>
    </table>
  </div>

</div><!-- /container -->

<div class="toast" id="toast"></div>

<script>
/* ===================================================
   STATE
=================================================== */
var S = {
  players: [],
  courts: 2,
  round: 0,
  playCounts: {},   // name -> number
  currentRound: null // { courts:[{n, teamA, teamB}], waiting:[] }
};

/* ===================================================
   INIT
=================================================== */
function init() {
  loadState();
  renderPlayerList();
  syncCourtButtons();
  updateStats();
  renderRound();
  renderStatsTable();

  var inp = document.getElementById('playerInput');
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); addPlayer(); }
  });
}

/* ===================================================
   PLAYER MANAGEMENT
=================================================== */
function addPlayer() {
  var inp = document.getElementById('playerInput');
  var raw = inp.value.trim();
  if (!raw) { showToast('Please enter a player name.'); return; }

  var lower = raw.toLowerCase();
  if (S.players.some(function(p){ return p.toLowerCase() === lower; })) {
    showToast('"' + raw + '" is already in the list.');
    return;
  }

  S.players.push(raw);
  if (S.playCounts[raw] === undefined) S.playCounts[raw] = 0;
  inp.value = '';
  inp.focus();

  save();
  renderPlayerList();
  updateStats();
  renderStatsTable();
  clearMsg();
}

function removePlayer(idx) {
  var name = S.players[idx];
  if (!confirm('Remove "' + name + '" from the list?')) return;

  S.players.splice(idx, 1);
  delete S.playCounts[name];

  // Invalidate current round if that player was in it
  if (S.currentRound) {
    var all = [];
    S.currentRound.courts.forEach(function(c) {
      all = all.concat(c.teamA, c.teamB);
    });
    all = all.concat(S.currentRound.waiting);
    if (all.indexOf(name) !== -1) {
      S.currentRound = null;
    }
  }

  save();
  renderPlayerList();
  updateStats();
  renderRound();
  renderStatsTable();
}

function clearAllPlayers() {
  if (S.players.length === 0) { showToast('No players to clear.'); return; }
  if (!confirm('Clear all players and reset rotation?')) return;
  S.players = [];
  S.playCounts = {};
  S.round = 0;
  S.currentRound = null;
  save();
  renderPlayerList();
  updateStats();
  renderRound();
  renderStatsTable();
  clearMsg();
}

function renderPlayerList() {
  var el = document.getElementById('playerList');
  if (S.players.length === 0) {
    el.innerHTML = '<div class="empty-hint">No players added yet. Enter names above.</div>';
    return;
  }
  el.innerHTML = S.players.map(function(name, i) {
    var games = S.playCounts[name] || 0;
    var badge = games > 0 ? '<span class="games-badge">' + games + ' game' + (games !== 1 ? 's' : '') + '</span>' : '';
    return '<div class="player-item">'
      + '<span class="player-name">' + (i+1) + '. ' + esc(name) + '</span>'
      + badge
      + '<button class="btn btn-danger btn-sm" onclick="removePlayer(' + i + ')">✕</button>'
      + '</div>';
  }).join('');
}

/* ===================================================
   COURT SETTINGS
=================================================== */
function setCourts(n) {
  S.courts = n;
  save();
  syncCourtButtons();
  updateStats();
}

function syncCourtButtons() {
  document.querySelectorAll('.court-btn').forEach(function(btn) {
    btn.classList.toggle('active', parseInt(btn.dataset.n) === S.courts);
  });
}

/* ===================================================
   STATS BAR
=================================================== */
function updateStats() {
  var total = S.players.length;
  var maxSlots = S.courts * 4;
  var raw = Math.min(maxSlots, total);
  var activeCourts = Math.floor(raw / 4);
  var playing = activeCourts * 4;
  var waiting = total - playing;

  document.getElementById('sTotal').textContent = total;
  document.getElementById('sPlaying').textContent = playing;
  document.getElementById('sWaiting').textContent = waiting > 0 ? waiting : 0;
  document.getElementById('sCourts').textContent = activeCourts;
}

/* ===================================================
   ROTATION ALGORITHM
=================================================== */
function generateRound() {
  var total = S.players.length;
  clearMsg();

  if (total < 4) {
    showMsg('Add at least 4 players to start.', 'warning');
    return;
  }

  var maxSlots = S.courts * 4;
  var raw = Math.min(maxSlots, total);
  var activeCourts = Math.floor(raw / 4);
  var playing = activeCourts * 4;

  if (activeCourts === 0) {
    showMsg('Need at least 4 players for 1 court.', 'warning');
    return;
  }

  if (total < playing && total < 4) {
    showMsg('Not enough players for the selected number of courts.', 'warning');
    return;
  }

  // Sort by play count (fewest first), shuffle within ties for variety
  var sorted = sortByCount(S.players, S.playCounts);

  var playingGroup = sorted.slice(0, playing);
  var waitingGroup = sorted.slice(playing);

  // Shuffle within the playing group to vary team compositions
  shuffle(playingGroup);

  // Build court assignments
  var courts = [];
  for (var i = 0; i < activeCourts; i++) {
    var o = i * 4;
    courts.push({
      n: i + 1,
      teamA: [playingGroup[o], playingGroup[o+1]],
      teamB: [playingGroup[o+2], playingGroup[o+3]]
    });
  }

  // Increment play counts
  playingGroup.forEach(function(name) {
    S.playCounts[name] = (S.playCounts[name] || 0) + 1;
  });

  S.round++;
  S.currentRound = { courts: courts, waiting: waitingGroup };

  save();
  renderRound();
  renderPlayerList();
  renderStatsTable();
  updateStats();

  var w = waitingGroup.length;
  var msg = 'Round ' + S.round + ' ready!';
  if (w > 0) msg += '  ' + w + ' player' + (w !== 1 ? 's' : '') + ' waiting.';
  else msg += ' All players on court!';
  showToast(msg);
}

function sortByCount(players, counts) {
  // Group by count
  var groups = {};
  players.forEach(function(name) {
    var c = counts[name] || 0;
    if (!groups[c]) groups[c] = [];
    groups[c].push(name);
  });
  // Sort groups ascending, shuffle within each group
  var keys = Object.keys(groups).map(Number).sort(function(a,b){ return a-b; });
  var result = [];
  keys.forEach(function(k) {
    var g = groups[k].slice();
    shuffle(g);
    result = result.concat(g);
  });
  return result;
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
}

function resetRotation() {
  if (S.round === 0 && !S.currentRound) {
    showToast('No rotation to reset.');
    return;
  }
  if (!confirm('Reset rotation? Play counts will be cleared but players stay.')) return;
  S.round = 0;
  S.currentRound = null;
  S.players.forEach(function(name) { S.playCounts[name] = 0; });
  save();
  renderRound();
  renderPlayerList();
  renderStatsTable();
  updateStats();
  clearMsg();
  showToast('Rotation reset.');
}

/* ===================================================
   RENDER ROUND
=================================================== */
var COURT_COLORS = ['1','2','3','4','5','6'];
var TEAM_A_ICON = '🟢';
var TEAM_B_ICON = '🔵';

function renderRound() {
  var el = document.getElementById('roundDisplay');

  if (!S.currentRound) {
    el.innerHTML = '<div class="no-round">'
      + '<div class="no-round-icon">🏓</div>'
      + '<p>Add players and tap<br><strong>Generate Next Round</strong> to begin!</p>'
      + '</div>';
    return;
  }

  var cr = S.currentRound;
  var html = '<div class="card">'
    + '<div class="round-header">'
    + '<div class="round-lbl">Current Round</div>'
    + '<div class="round-num">Round ' + S.round + '</div>'
    + '</div>';

  // Courts
  cr.courts.forEach(function(c, idx) {
    var cls = 'court-card court-card-' + Math.min(idx+1, 6);
    var dotCls = 'court-dot dot-' + Math.min(idx+1, 6);
    html += '<div class="' + cls + '">'
      + '<div class="court-name">'
      + '<span class="' + dotCls + '"></span>'
      + 'Court ' + c.n
      + '</div>'
      + '<div class="teams-row">'
      + '<div class="team-box">'
      + '<div class="team-lbl">Team A</div>'
      + '<div class="team-player"><span>' + TEAM_A_ICON + '</span>' + esc(c.teamA[0]) + '</div>'
      + '<div class="team-player"><span>' + TEAM_A_ICON + '</span>' + esc(c.teamA[1]) + '</div>'
      + '</div>'
      + '<div class="vs-col">VS</div>'
      + '<div class="team-box">'
      + '<div class="team-lbl">Team B</div>'
      + '<div class="team-player"><span>' + TEAM_B_ICON + '</span>' + esc(c.teamB[0]) + '</div>'
      + '<div class="team-player"><span>' + TEAM_B_ICON + '</span>' + esc(c.teamB[1]) + '</div>'
      + '</div>'
      + '</div>'
      + '</div>';
  });

  html += '</div>'; // close .card

  // Waiting players
  if (cr.waiting && cr.waiting.length > 0) {
    html += '<div class="waiting-card">'
      + '<div class="waiting-header">⏳ Waiting / Resting — '
      + cr.waiting.length + ' player' + (cr.waiting.length !== 1 ? 's' : '') + '</div>'
      + '<div class="waiting-chips">'
      + cr.waiting.map(function(name) {
          return '<div class="waiting-chip">' + esc(name) + '</div>';
        }).join('')
      + '</div></div>';
  }

  el.innerHTML = html;
}

/* ===================================================
   STATS TABLE
=================================================== */
function renderStatsTable() {
  var card = document.getElementById('statsCard');
  var body = document.getElementById('statsBody');

  if (S.players.length === 0 || S.round === 0) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';

  var maxGames = S.players.reduce(function(m, p) {
    return Math.max(m, S.playCounts[p] || 0);
  }, 1);

  var sorted = S.players.slice().sort(function(a, b) {
    return (S.playCounts[b] || 0) - (S.playCounts[a] || 0);
  });

  body.innerHTML = sorted.map(function(name) {
    var g = S.playCounts[name] || 0;
    var pct = Math.round((g / maxGames) * 100);
    return '<tr>'
      + '<td>' + esc(name) + '</td>'
      + '<td style="text-align:center;font-weight:700">' + g + '</td>'
      + '<td style="width:80px"><div class="play-bar-wrap"><div class="play-bar" style="width:' + pct + '%"></div></div></td>'
      + '</tr>';
  }).join('');
}

/* ===================================================
   MESSAGES & TOASTS
=================================================== */
function showMsg(text, type) {
  var el = document.getElementById('msgBox');
  el.className = 'msg-box ' + (type || 'info');
  el.textContent = text;
}
function clearMsg() {
  var el = document.getElementById('msgBox');
  el.className = 'msg-box';
  el.textContent = '';
}

var toastTimer;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3200);
}

/* ===================================================
   LOCAL STORAGE
=================================================== */
var STORAGE_KEY = 'pickleballRotation_v1';

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch(e) {}
}

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var parsed = JSON.parse(raw);
    if (Array.isArray(parsed.players)) S.players = parsed.players;
    if (typeof parsed.courts === 'number') S.courts = parsed.courts;
    if (typeof parsed.round === 'number') S.round = parsed.round;
    if (parsed.playCounts && typeof parsed.playCounts === 'object') S.playCounts = parsed.playCounts;
    if (parsed.currentRound) S.currentRound = parsed.currentRound;
    // Ensure all players have a count entry
    S.players.forEach(function(p) {
      if (S.playCounts[p] === undefined) S.playCounts[p] = 0;
    });
  } catch(e) {}
}

/* ===================================================
   HELPERS
=================================================== */
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

/* ===================================================
   START
=================================================== */
init();
</script>
